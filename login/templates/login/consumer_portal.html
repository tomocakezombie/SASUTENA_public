{% extends "base.html" %}

{% block title %}消費者メニュー{% endblock %}

{% block content %}
<section class="py-5">
	<div class="container" style="max-width: 780px;">
		<div class="card shadow-sm border-0 mb-4">
			<div class="card-body d-flex flex-column flex-md-row justify-content-between align-items-start gap-3">
				<div>
					<p class="text-muted small mb-1">ログイン中</p>
					<h1 class="h5 mb-1">{{ request.user.username }} さん</h1>
					<p class="text-muted small mb-0">消費者メニュー</p>
				</div>
				<div class="d-flex flex-wrap gap-2 ms-md-auto">
					<a href="{% url 'accounts:my_page' %}" class="btn btn-outline-primary btn-sm">マイページを見る</a>
					<a href="{% url 'login:logout' %}" class="btn btn-outline-secondary btn-sm">ログアウト</a>
				</div>
			</div>
		</div>

		<div class="card border-0 shadow-sm">
			<div class="card-body p-4">
				<h2 class="h6 mb-4">操作を選択してください</h2>
				<div class="row g-3">
					<div class="col-12 col-md-6">
						<a href="{% url 'product:consumer_product_list' %}" class="btn btn-primary w-100 py-3">商品を検索・申込みする</a>
					</div>
					<div class="col-12 col-md-6">
						<a href="{% url 'accounts:producer_evaluation_overview' %}" class="btn btn-outline-primary w-100 py-3">生産者を評価する</a>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
{% endblock %}
