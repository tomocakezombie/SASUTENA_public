<h2>あなたの出品一覧</h2>

<a href="{% url 'product:product_create' %}">商品を登録する</a>
<hr>

{% if products %}
    {% for p in products %}
        <div style="margin-bottom: 20px;">
            <strong>{{ p.item_name }}</strong><br>
            数量：{{ p.number }}<br>
            受け渡し期間：{{ p.start_time }} ～ {{ p.end_time }}<br>
            説明：{{ p.description }}<br>

            {% if p.item_image %}
                <img src="{{ p.item_image.url }}" width="140"><br>
            {% endif %}

            <a href="{% url 'product:product_delete' p.item_id %}">削除</a>
        </div>
        <hr>
    {% endfor %}
{% else %}
    <p>まだ出品している商品はありません。</p>
{% endif %}
