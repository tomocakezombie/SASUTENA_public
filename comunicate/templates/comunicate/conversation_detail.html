{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <div class="card shadow-sm border-0">
    <div class="card-header bg-white">
      <h1 class="h5 mb-0">{{ target_user.username }} さんとの会話</h1>
      {% if thread_item %}
      <div class="small text-muted">商品: {{ thread_item.item_name }}</div>
      {% endif %}
    </div>
    <div class="card-body bg-light">
      {% include "comunicate/partials/conversation_thread.html" %}
    </div>
  </div>
</div>
{% endblock %}
